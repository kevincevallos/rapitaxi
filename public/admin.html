<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>RapiTaxi - Administración</title>

  <style>
    :root {
      --morado: #5b2ca0;
      --morado-claro: #7441bd;
      --fondo: #f5f5f8;
      --blanco: #ffffff;
      --texto: #252525;
      --gris: #707070;
      --border: #ddddE5;
      --verde: #199447;
      --rojo: #d83b3b;
      --amarillo: #d79b00;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--fondo);
      color: var(--texto);
    }

    header {
      background:
        linear-gradient(
          135deg,
          var(--morado),
          var(--morado-claro)
        );
      color: white;
      padding: 22px 25px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, .15);
    }

    header h1 {
      margin: 0;
      font-size: 27px;
    }

    header p {
      margin: 5px 0 0;
      opacity: .85;
      font-size: 14px;
    }

    .contenedor {
      width: min(1400px, 96%);
      margin: 25px auto;
    }

    .barra-superior {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 8px;
    }

    .tab {
      border: none;
      background: white;
      padding: 11px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .06);
    }

    .tab.activo {
      background: var(--morado);
      color: white;
    }

    .btn-principal {
      border: none;
      background: var(--morado);
      color: white;
      padding: 12px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-principal:hover {
      background: var(--morado-claro);
    }

    .panel {
      display: none;
    }

    .panel.activo {
      display: block;
    }

    .tarjeta {
      background: white;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 3px 15px rgba(0, 0, 0, .07);
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th,
    td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 14px;
      vertical-align: middle;
    }

    th {
      color: var(--gris);
      font-size: 12px;
      text-transform: uppercase;
      background: #fafafd;
    }

    tr:hover td {
      background: #fbfaff;
    }

    .estado {
      display: inline-block;
      border-radius: 999px;
      padding: 5px 10px;
      font-size: 11px;
      font-weight: bold;
    }

    .estado-buscando {
      background: #fff3d0;
      color: #8f6800;
    }

    .estado-asignada,
    .estado-en_camino,
    .estado-cerca,
    .estado-llego {
      background: #e7f0ff;
      color: #1d5ca8;
    }

    .estado-completada,
    .estado-activo {
      background: #dff5e6;
      color: var(--verde);
    }

    .estado-cancelada,
    .estado-inactivo {
      background: #fde3e3;
      color: var(--rojo);
    }

    .acciones {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      border: none;
      padding: 8px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-editar {
      background: #ece6f7;
      color: var(--morado);
    }

    .btn-desactivar {
      background: #fde5e5;
      color: var(--rojo);
    }

    .btn-activar {
      background: #dff5e6;
      color: var(--verde);
    }

    .vacio {
      color: #999;
    }

    .modal-fondo {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      z-index: 1000;
    }

    .modal-fondo.visible {
      display: flex;
    }

    .modal {
      width: min(700px, 100%);
      max-height: 94vh;
      overflow-y: auto;
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 15px 50px rgba(0, 0, 0, .25);
    }

    .modal h2 {
      margin-top: 0;
      color: var(--morado);
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .campo {
      margin-bottom: 13px;
    }

    .campo-completo {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
      color: #555;
      text-transform: uppercase;
    }

    input,
    select {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font: inherit;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus {
      border-color: var(--morado);
    }

    input:disabled {
      background: #eeeeef;
      color: #777;
    }

    .seccion-form {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .seccion-form h3 {
      margin: 0 0 13px;
      color: var(--morado);
      font-size: 15px;
    }

    .botones-modal {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 20px;
    }

    .btn-cancelar {
      background: #eeeeef;
      color: #555;
    }

    .mensaje {
      margin-bottom: 15px;
      padding: 11px 14px;
      border-radius: 9px;
      display: none;
    }

    .mensaje.visible {
      display: block;
    }

    .mensaje.ok {
      background: #e2f5e8;
      color: #18743a;
    }

    .mensaje.error {
      background: #fde5e5;
      color: #aa2929;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .campo-completo {
        grid-column: auto;
      }

      header h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>🚖 RapiTaxi</h1>
    <p>Panel de administración</p>
  </header>


  <main class="contenedor">

    <div
      id="mensajeGeneral"
      class="mensaje"
    ></div>


    <div class="barra-superior">

      <div class="tabs">

        <button
          id="tabCarreras"
          class="tab activo"
          type="button"
        >
          Carreras
        </button>

        <button
          id="tabTaxistas"
          class="tab"
          type="button"
        >
          Taxistas
        </button>

      </div>


      <button
        id="btnNuevoTaxista"
        class="btn-principal"
        type="button"
      >
        + Registrar taxista
      </button>

    </div>


    <!-- ============================= -->
    <!-- CARRERAS -->
    <!-- ============================= -->

    <section
      id="panelCarreras"
      class="panel activo"
    >

      <div class="tarjeta">

        <table>

          <thead>

            <tr>
              <th>Carrera</th>
              <th>Estado</th>
              <th>Cliente</th>
              <th>Referencia</th>
              <th>Pago</th>
              <th>Taxista</th>
              <th>Placa</th>
              <th>Fecha</th>
              <th>Enlace</th>
            </tr>

          </thead>


          <tbody
            id="tablaCarreras"
          >
          </tbody>

        </table>

      </div>

    </section>


    <!-- ============================= -->
    <!-- TAXISTAS -->
    <!-- ============================= -->

    <section
      id="panelTaxistas"
      class="panel"
    >

      <div class="tarjeta">

        <table>

          <thead>

            <tr>
              <th>Código</th>
              <th>Nombre</th>
              <th>Placa</th>
              <th>Vehículo</th>
              <th>Color</th>
              <th>Cooperativa</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>

          </thead>


          <tbody
            id="tablaTaxistas"
          >
          </tbody>

        </table>

      </div>

    </section>

  </main>


  <!-- ============================= -->
  <!-- MODAL NUEVO TAXISTA -->
  <!-- ============================= -->

  <div
    id="modalNuevoTaxista"
    class="modal-fondo"
  >

    <div class="modal">

      <h2>Registrar taxista</h2>


      <form
        id="formNuevoTaxista"
      >

        <div class="grid">

          <div class="campo">
            <label>Código único</label>
            <input
              id="codigo"
              maxlength="3"
              inputmode="numeric"
              placeholder="001"
              required
            />
          </div>


          <div class="campo">
            <label>Nombre</label>
            <input
              id="nombre"
              placeholder="Juan Marcillo"
              required
            />
          </div>


          <div class="campo">
            <label>Placa</label>
            <input
              id="placa"
              placeholder="MMA-8584"
              required
            />
          </div>


          <div class="campo">
            <label>Vehículo</label>
            <input
              id="vehiculo"
              placeholder="Hyundai Accent"
              required
            />
          </div>


          <div class="campo">
            <label>Color</label>
            <input
              id="colorVehiculo"
              placeholder="Amarillo"
            />
          </div>


          <div class="campo">
            <label>Cooperativa</label>
            <input
              id="cooperativa"
              placeholder="Cooperativa X"
            />
          </div>


          <div class="campo campo-completo">
            <label>Teléfono</label>
            <input
              id="telefono"
              inputmode="tel"
              placeholder="0999999999"
            />
          </div>

        </div>


        <div class="seccion-form">

          <h3>
            Banco Pichincha
          </h3>


          <div class="grid">

            <div class="campo">
              <label>
                Titular de la cuenta
              </label>

              <input
                id="titularPichincha"
                placeholder="Juan Marcillo"
              />
            </div>


            <div class="campo">
              <label>
                Número de cuenta
              </label>

              <input
                id="cuentaPichincha"
                inputmode="numeric"
                placeholder="2203031222"
              />
            </div>

          </div>

        </div>


        <div class="seccion-form">

          <h3>
            Banco Guayaquil
          </h3>


          <div class="grid">

            <div class="campo">
              <label>
                Titular de la cuenta
              </label>

              <input
                id="titularGuayaquil"
                placeholder="Juan Marcillo"
              />
            </div>


            <div class="campo">
              <label>
                Número de cuenta
              </label>

              <input
                id="cuentaGuayaquil"
                inputmode="numeric"
                placeholder="1234567890"
              />
            </div>

          </div>

        </div>


        <div class="botones-modal">

          <button
            id="cancelarNuevoTaxista"
            class="btn btn-cancelar"
            type="button"
          >
            Cancelar
          </button>


          <button
            class="btn-principal"
            type="submit"
          >
            Guardar taxista
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- ============================= -->
  <!-- MODAL EDITAR TAXISTA -->
  <!-- ============================= -->

  <div
    id="modalEditarTaxista"
    class="modal-fondo"
  >

    <div class="modal">

      <h2>Editar taxista</h2>


      <form
        id="formEditarTaxista"
      >

        <input
          id="editarId"
          type="hidden"
        />


        <div class="grid">

          <div class="campo">
            <label>Código único</label>

            <input
            id="editarCodigo"
            maxlength="3"
            inputmode="numeric"
            required
            />
          </div>


          <div class="campo">
            <label>Nombre</label>

            <input
              id="editarNombre"
              required
            />
          </div>


          <div class="campo">
            <label>Placa</label>

            <input
              id="editarPlaca"
              required
            />
          </div>


          <div class="campo">
            <label>Vehículo</label>

            <input
              id="editarVehiculo"
              required
            />
          </div>


          <div class="campo">
            <label>Color</label>

            <input
              id="editarColorVehiculo"
            />
          </div>


          <div class="campo">
            <label>Cooperativa</label>

            <input
              id="editarCooperativa"
            />
          </div>


          <div class="campo campo-completo">
            <label>Teléfono</label>

            <input
              id="editarTelefono"
              inputmode="tel"
            />
          </div>

        </div>


        <div class="seccion-form">

          <h3>
            Banco Pichincha
          </h3>


          <div class="grid">

            <div class="campo">

              <label>
                Titular de la cuenta
              </label>

              <input
                id="editarTitularPichincha"
              />

            </div>


            <div class="campo">

              <label>
                Número de cuenta
              </label>

              <input
                id="editarCuentaPichincha"
                inputmode="numeric"
              />

            </div>

          </div>

        </div>


        <div class="seccion-form">

          <h3>
            Banco Guayaquil
          </h3>


          <div class="grid">

            <div class="campo">

              <label>
                Titular de la cuenta
              </label>

              <input
                id="editarTitularGuayaquil"
              />

            </div>


            <div class="campo">

              <label>
                Número de cuenta
              </label>

              <input
                id="editarCuentaGuayaquil"
                inputmode="numeric"
              />

            </div>

          </div>

        </div>


        <div class="botones-modal">

          <button
            id="cancelarEditarTaxista"
            class="btn btn-cancelar"
            type="button"
          >
            Cancelar
          </button>


          <button
            class="btn-principal"
            type="submit"
          >
            Guardar cambios
          </button>

        </div>

      </form>

    </div>

  </div>


  <script src="/admin.js"></script>

</body>
</html>
